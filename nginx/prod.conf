# Rate limit for the ingest and inference endpoints. This file is included
# inside nginx's http {} context (mounted as conf.d/default.conf), which is where
# limit_req_zone has to live. The zone is prefixed with the app's name because
# this nginx is shared with the portfolio site's override.
#
# 12 requests a minute per client, burst 10: the scheduled producer sends one
# ingest batch every 30 minutes and one inference run a day, so this is ~360x
# headroom for it and a hard ceiling for anyone else.
limit_req_zone $binary_remote_addr zone=elevator_ingest:1m rate=12r/m;

server {
    listen 80;
    server_name elevator.dsaavedra.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name elevator.dsaavedra.dev;

    ssl_certificate     /etc/letsencrypt/live/dsaavedra.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsaavedra.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Exact-match locations win over the /api/ prefix below, so the limit
    # applies to these two paths and nothing else — never to the dashboard.
    # Location matching ignores the query string, so the guarded
    # GET /api/telemetry/readings?elevator_id=... is limited too.
    location = /api/telemetry/readings {
        limit_req          zone=elevator_ingest burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/inference/run {
        limit_req          zone=elevator_ingest burst=10 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
    }

    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
