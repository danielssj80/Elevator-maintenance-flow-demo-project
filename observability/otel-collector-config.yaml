# OpenTelemetry Collector — local development.
#
# The grafana/otel-lgtm image bundles its own Collector, but that one is an
# ingest endpoint for its local backends. This Collector owns routing: batching,
# memory limiting, the Grafana Cloud fan-out, and (in the n8n change) scraping
# n8n's Prometheus endpoint. Only this Collector publishes 4317/4318 to the host.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape our OWN self-telemetry into the metrics pipeline. Without this the
  # otelcol_* series reaching Prometheus come from the collector bundled inside
  # the LGTM image, not from this one — so a dashboard panel watching
  # otelcol_exporter_send_failed_spans would be watching the wrong process and
  # would stay green through a total export failure here.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

  # n8n's Prometheus endpoint. Both processes are scraped, labelled by role, so
  # a dashboard can tell main from worker — but only main reports queue depth
  # (the Bull metrics live there), which is why the orchestration dashboard's
  # queue panels must not be built against the worker target.
  #
  # The worker is listed even though the `queue` profile may not be running:
  # a target that does not resolve is reported as `up == 0` rather than failing
  # the Collector, and "the worker is down" is a truthful thing for the metric
  # to say. It is also how 6.4 gets answered honestly instead of by assumption.
  prometheus/n8n:
    config:
      scrape_configs:
        - job_name: n8n
          scrape_interval: 15s
          static_configs:
            - targets: ["n8n:5678"]
              labels:
                n8n_role: main
            - targets: ["n8n-worker:5678"]
              labels:
                n8n_role: worker

processors:
  # First in every pipeline: refuses data rather than letting the Collector be
  # OOM-killed, which on an 8 GB WSL host is a real risk with LGTM alongside.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  batch:
    send_batch_size: 1024
    timeout: 5s

  resource/env:
    attributes:
      # `insert`, not `upsert`: upsert overwrites the value the application
      # already set from DEPLOYMENT_ENVIRONMENT, making that setting and the
      # Resource attribute dead. This only fills in a default for senders that
      # do not declare one.
      - key: deployment.environment.name
        value: local
        action: insert

exporters:
  otlp_http/local:
    # BASE url. The Collector appends /v1/traces, /v1/metrics and /v1/logs.
    endpoint: http://lgtm:4318
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      # Exposes otelcol_exporter_send_failed_* so a silently failing exporter
      # (notably Grafana Cloud auth) is observable rather than invisible.
      # As of Collector 0.159 `level:` alone no longer serves an endpoint —
      # a reader must be declared, and it must bind 0.0.0.0 to be reachable
      # from outside the container.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/local]
    metrics:
      receivers: [otlp, prometheus/self, prometheus/n8n]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/local]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp_http/local]
