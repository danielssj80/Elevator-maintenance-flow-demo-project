name: Publish Lambda images

# The orchestrator (n8n) and the scorer run as AWS Lambda functions. Lambda
# pulls only from private ECR, so these two images do not go to GHCR.
#
# A workflow of its own on purpose: deploy.yml runs when "Build and push
# images" succeeds, and a failure here (say, functions not provisioned yet)
# must not block the application deploy.

on:
  push:
    branches: [main]
  # Manual re-run of a push whose event GitHub never delivered (2026-10-13:
  # the merge of #39 created no runs and never registered this workflow).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lambda-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATOR_REPO: elevator-orchestrator
      SCORER_REPO: elevator-scorer
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Two Lambda constraints, both learned in AWS:
      # - one image manifest, not an index: BuildKit wraps the image in an index
      #   whenever it attaches provenance or SBOM attestations (no attestations);
      # - every layer really gzip: n8nio/n8n ships zstd layers, and the runner's
      #   classic Docker pushed them under a gzip media type, which Lambda
      #   rejects as UnsupportedImageLayerDetected (force-compression=true).
      - name: Build and push orchestrator image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/elevator-orchestrator:${{ github.sha }}
        run: >-
          docker buildx build --provenance=false --sbom=false
          --output "type=image,name=$IMAGE,push=true,compression=gzip,force-compression=true,oci-mediatypes=true"
          -f orchestrator/Dockerfile .

      - name: Build and push scorer image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/elevator-scorer:${{ github.sha }}
        run: >-
          docker buildx build --provenance=false --sbom=false
          --output "type=image,name=$IMAGE,push=true,compression=gzip,force-compression=true,oci-mediatypes=true"
          -f backend/inference/Dockerfile.lambda backend

      # Both images exist before either function moves, so a failed build above
      # leaves both functions on their previous image.
      - name: Point the functions at this commit
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          aws lambda update-function-code --function-name elevator-orchestrator \
            --image-uri "$REGISTRY/elevator-orchestrator:$SHA" >/dev/null
          aws lambda update-function-code --function-name elevator-scorer \
            --image-uri "$REGISTRY/elevator-scorer:$SHA" >/dev/null
          aws lambda wait function-updated-v2 --function-name elevator-orchestrator
          aws lambda wait function-updated-v2 --function-name elevator-scorer
