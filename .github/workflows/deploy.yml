name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  HEALTH_URL: https://elevator.dsaavedra.dev/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send
        run: |
          # shellcheck disable=SC2016  # $CF is intentionally literal: it must expand on the EC2 instance (inside the SSM script), not on the GitHub runner
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters '{
              "commands": [
                "set -eu",
                "cd /opt/elevator",
                "git fetch origin main",
                "git reset --hard origin/main",
                "CF=\"-f docker-compose.prod.yml\"",
                "if [ -f /opt/portfolio/docker-compose.portfolio.yml ]; then",
                "  CF=\"$CF -f /opt/portfolio/docker-compose.portfolio.yml\"",
                "  if ! docker compose $CF run --rm --no-deps -T --entrypoint nginx nginx -t; then",
                "    echo \"WARNING: merged nginx config invalid; deploying Elevator without the portfolio override\" >&2",
                "    CF=\"-f docker-compose.prod.yml\"",
                "  fi",
                "fi",
                "flock -w 600 /opt/deploy.lock docker compose $CF up --build -d"
              ],
              "executionTimeout": ["3600"]
            }' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for remote command and propagate result
        run: |
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          STATUS="Pending"
          # InvocationDoesNotExist can occur right after send-command; retry until terminal status.
          # 240 × 15s = 3600s, matching the SSM executionTimeout so a cold, full image rebuild
          # (no Docker layer cache on the instance) has time to finish instead of TimedOut.
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done
          # Log fetches must never decide the job result — guard them so a
          # transient SSM API error can't fail an otherwise successful deploy.
          # Only the status assertion below determines success.
          echo "::group::Remote stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || echo "(stdout unavailable)"
          echo "::endgroup::"
          echo "::group::Remote stderr"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || echo "(stderr unavailable)"
          echo "::endgroup::"
          echo "SSM command status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke check
        run: |
          for attempt in $(seq 1 12); do
            if curl -sf "$HEALTH_URL" | grep -q '"status"'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Smoke check failed: $HEALTH_URL did not return a healthy response"
          exit 1
