name: Deploy to production

on:
  workflow_run:
    workflows: ["Build and push images"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  HEALTH_URL: https://elevator.dsaavedra.dev/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This job's concurrency group is serialized and does not cancel in progress,
    # so a step that hangs delays every subsequent production deploy behind it.
    # Nothing here should ever take thirty minutes.
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send
        run: |
          # shellcheck disable=SC2016  # $CF is intentionally literal: it must expand on the EC2 instance (inside the SSM script), not on the GitHub runner
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.event.workflow_run.head_sha }}" \
            --parameters '{
              "commands": [
                "set -eu",
                "cd /opt/elevator",
                "git fetch origin main",
                "git reset --hard origin/main",
                "export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}",
                "CF=\"-f docker-compose.prod.yml\"",
                "if [ -f /opt/portfolio/docker-compose.portfolio.yml ]; then",
                "  CF=\"$CF -f /opt/portfolio/docker-compose.portfolio.yml\"",
                "  if ! docker compose $CF run --rm --no-deps -T --entrypoint nginx nginx -t; then",
                "    echo \"WARNING: merged nginx config invalid; deploying Elevator without the portfolio override\" >&2",
                "    CF=\"-f docker-compose.prod.yml\"",
                "  fi",
                "fi",
                "flock -w 600 /opt/deploy.lock sh -c \"docker compose $CF pull && docker compose $CF up -d\""
              ],
              "executionTimeout": ["1800"]
            }' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for remote command and propagate result
        run: |
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          STATUS="Pending"
          # InvocationDoesNotExist can occur right after send-command; retry until terminal status
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done
          # Log fetches must never decide the job result — guard them so a
          # transient SSM API error can't fail an otherwise successful deploy.
          # Only the status assertion below determines success.
          echo "::group::Remote stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || echo "(stdout unavailable)"
          echo "::endgroup::"
          echo "::group::Remote stderr"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || echo "(stderr unavailable)"
          echo "::endgroup::"
          echo "SSM command status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke check
        run: |
          for attempt in $(seq 1 12); do
            if curl -sf "$HEALTH_URL" | grep -q '"status"'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Smoke check failed: $HEALTH_URL did not return a healthy response"
          exit 1

      # Everything below runs *after* the smoke check, deliberately. Renewal
      # configuration must never be able to prevent or revert an application
      # deploy — but it must still turn the run red, because a warning that fails
      # nothing is how thirty consecutive renewal failures went unnoticed and the
      # certificate expired on 2026-09-10.
      - name: Re-assert TLS renewal configuration on the instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Install TLS renewal ${{ github.event.workflow_run.head_sha }}" \
            --parameters '{
              "commands": [
                "set -eu",
                "sh /opt/elevator/deploy/tls/install-renewal.sh"
              ],
              "executionTimeout": ["600"]
            }' \
            --query "Command.CommandId" --output text)
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          # An unaccepted send-command leaves this empty; polling for it would
          # burn the whole window and then report a failure with no cause.
          test -n "$COMMAND_ID" || { echo "send-command returned no command id" >&2; exit 1; }
          STATUS="Pending"
          # 120 x 5s covers the 600s executionTimeout above. Polling for less than
          # the command is allowed to take reports a slow success as a failure.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          # The installer prints the timer's next scheduled run; that line is the
          # answer to "is renewal actually armed?", so keep it in the log.
          echo "::group::Remote output"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || echo "(stdout unavailable)"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || echo "(stderr unavailable)"
          echo "::endgroup::"
          echo "SSM command status: $STATUS"
          test "$STATUS" = "Success"

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # On a workflow_run event the default ref is the default branch's head,
          # which is not necessarily what was just deployed. Pin the same SHA the
          # deploy used two steps above.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Report certificate health
        run: |
          # Retried for the same reason the smoke check is: a transient network
          # fault on the runner must not mark a successful production deploy as
          # failed. A certificate genuinely inside the threshold fails all three
          # attempts and the run goes red, which is the point.
          rc=0
          for host in elevator.dsaavedra.dev dsaavedra.dev; do
            for attempt in 1 2 3; do
              if sh scripts/check-tls-expiry.sh "$host"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Certificate health check failed for $host after 3 attempts" >&2
                rc=1
              else
                sleep 10
              fi
            done
          done
          exit $rc
