name: Build and push images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elevator-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/elevator-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Clean up old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: elevator-backend
          package-type: container
          min-versions-to-keep: 11
          ignore-versions: "^latest$"

      - name: Clean up old image versions (frontend)
        uses: actions/delete-package-versions@v5
        with:
          package-name: elevator-frontend
          package-type: container
          min-versions-to-keep: 11
          ignore-versions: "^latest$"
