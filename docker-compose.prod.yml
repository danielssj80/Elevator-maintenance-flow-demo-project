services:
  db:
    image: postgres:16-alpine
    env_file: /etc/elevator/.env
    volumes:
      - elevator_postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/danielssj80/elevator-backend:${IMAGE_TAG:-latest}
    command: alembic upgrade head
    env_file: /etc/elevator/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  backend:
    image: ghcr.io/danielssj80/elevator-backend:${IMAGE_TAG:-latest}
    env_file: /etc/elevator/.env
    # Bedrock env vars — add to /etc/elevator/.env on the EC2 instance:
    #   BEDROCK_REGION=eu-north-1
    #   BEDROCK_MODEL_ID=eu.amazon.nova-lite-v1:0
    # The instance role (elevator-ssm-role) must have the customer-managed policy
    # ElevatorBedrockInvokeNova attached (bedrock:InvokeModel on the EU Nova Lite
    # inference-profile ARN + its 4 routed foundation-model ARNs).
    # Without these, the briefing endpoint returns source="fallback" (200, not 5xx).
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/danielssj80/elevator-frontend:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  elevator_postgres_data_prod:
